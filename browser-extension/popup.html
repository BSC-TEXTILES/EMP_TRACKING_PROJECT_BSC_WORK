<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>BSC Activity Tracker</title>
  <style>
    body { font: 13px/1.45 "Segoe UI", system-ui, sans-serif; margin: 0; width: 300px; color: #1f2937; background: #fff; }
    header { background: #1f3a5f; color: #fff; padding: 12px 14px; font-weight: 600; }
    main { padding: 12px 14px; }
    .status { display: flex; align-items: center; gap: 8px; font-weight: 600; margin-bottom: 8px; }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: #9ca3af; }
    .ok .dot { background: #16a34a; } .warn .dot { background: #d97706; }
    p { margin: 6px 0; color: #4b5563; }
  </style>
</head>
<body>
  <header>BSC Activity Tracker</header>
  <main>
    <div id="status" class="status"><span class="dot"></span><span id="label">Checking…</span></div>
    <p id="detail"></p>
    <p>This connector shares only the <strong>domain</strong> of the active tab with the tracker on this computer. It never reads page content, full addresses, titles, forms or passwords, and ignores incognito windows.</p>
  </main>
  <script src="popup.js"></script>
</body>
</html>
