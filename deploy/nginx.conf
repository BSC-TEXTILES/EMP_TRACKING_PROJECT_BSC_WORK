# Install inside nginx's http context. Replace emp.bsctextiles.in and certificate paths.
map $http_upgrade $connection_upgrade { default upgrade; '' close; }
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=connections:10m;
upstream workforce { server 127.0.0.1:4000; keepalive 32; }
server {
    listen 80;
    server_name emp.bsctextiles.in;
    return 308 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name emp.bsctextiles.in;
    ssl_certificate /etc/letsencrypt/live/emp.bsctextiles.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/emp.bsctextiles.in/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    client_max_body_size 16m;
    client_body_timeout 30s;
    keepalive_timeout 65s;
    limit_conn connections 100;
    limit_req_status 429;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    # Never record query strings, cookies, or authorization headers in access logs.
    access_log off;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
    location /socket.io/ {
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 75s;
        proxy_buffering off;
        proxy_pass http://workforce;
    }
    location /api/setup/install {
        limit_req zone=api burst=10 nodelay;
        proxy_read_timeout 180s;
        proxy_pass http://workforce;
    }
    location /api/ {
        limit_req zone=api burst=100 nodelay;
        proxy_set_header Connection "";
        proxy_pass http://workforce;
    }
    # There is no public storage directory. Use authenticated /api/files/:id.
    location /uploads/ { return 404; }
    location / {
        proxy_set_header Connection "";
        proxy_pass http://workforce;
    }
}
